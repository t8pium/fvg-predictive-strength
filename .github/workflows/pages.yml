name: Deploy static research report

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "fvg_research/report.py"
      - "fvg_research/explainers.py"
      - "reference_results/**"
      - "scripts/generate_static_report.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate report
        run: python scripts/generate_static_report.py --output site/index.html

      - name: Add Pages metadata
        run: |
          touch site/.nojekyll
          printf '%s\n' 'FVG Predictive Strength — generated from repository evidence' > site/README.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
