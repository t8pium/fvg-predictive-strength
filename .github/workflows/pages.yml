name: Deploy static research report

on:
  push:
    branches: [main]
    paths:
      - "app/catalog.py"
      - "app/provenance.py"
      - "fvg_research/explainers.py"
      - "fvg_research/report.py"
      - "reference_results/**"
      - "scripts/generate_static_report.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate static report
        run: python scripts/generate_static_report.py --output site/index.html
      - name: Add Pages marker
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
