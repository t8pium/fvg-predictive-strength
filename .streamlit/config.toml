[server]
# Browser uploads are intentionally capped; multi-GB datasets should use the
# dashboard's local-path importer, which streams from disk.
maxUploadSize = 1024
maxMessageSize = 1024
showEmailPrompt = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#111827"
textColor = "#f8fafc"
font = "sans serif"
